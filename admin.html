<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم مراسيل الرقمية</title>
<style>
body{font-family:Arial;background:#f3f4f6;padding:30px}
.box{max-width:500px;margin:auto;background:white;padding:25px;border-radius:15px}
h2{text-align:center}
input,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}
button{background:#12345a;color:white;border:0;border-radius:6px}
</style>
</head>
<body>
<div class="box">
<h2>لوحة تحكم مراسيل الرقمية</h2>

<label>اسم المؤسسة</label>
<input type="text" placeholder="مراسيل الرقمية">

<label>وصف المؤسسة</label>
<input type="text" placeholder="اكتب وصف المؤسسة">

<label>رقم الهاتف</label>
<input type="text" placeholder="05xxxxxxxx">

<label>رقم الواتساب</label>
<input type="text" placeholder="05xxxxxxxx">

<button>حفظ التعديلات</button>
</div>
</body>
</html>
